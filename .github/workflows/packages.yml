name: packages

# Distribution packages built from source: .deb (Debian), .rpm (Fedora), .pkg.tar.zst (Arch Linux),
# for x86_64 and arm64, on the `main` and `stable` branches.
#
# RPM package names:
#   LH4051-DE                    desktop shell and session wrapper
#   lh4051-de-data               application menu entry
#   lh4051-de-session                    Openbox X11 session
#   lh4051-de-session-{xfwm4,marco,metacity,icewm,fluxbox}  optional X11 sessions
#   lh4051-de-session-wayland            Labwc Wayland session
#   lh4051-de-session-wayland-sway       Sway Wayland session
#   lh4051-de-sessions-{x11,wayland}-all  session-group meta-packages
#   lh4051-de-sessions-all                all-session meta-package
#   lh4051-de-updater                     optional updater command
#   lh4051-de-bootstrap          optional GTK/dependency bootstrap command
#
# RPMs are built from packaging/rpm/lh4051-de.spec.in. Architecture-independent
# packages are built once, by the x86_64 job, and shared by both architectures.
#
# The universal installers and tarballs are built by build.yml; this workflow only adds native packages.

on:
  push:
    branches:
      - main
      - stable
  pull_request:
    branches:
      - main
      - stable
  workflow_dispatch:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.format }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Debian packages, built with dpkg-buildpackage in Debian trixie (GTK 4.18)
          - { format: deb,  arch: x86_64, runner: ubuntu-latest,     image: "debian:trixie",         data: "1", glob: "dist/*.deb" }
          - { format: deb,  arch: arm64,  runner: ubuntu-24.04-arm,  image: "debian:trixie",         data: "0", glob: "dist/*.deb" }
          # --- RPM packages, built with rpmbuild in Fedora
          - { format: rpm,  arch: x86_64, runner: ubuntu-latest,     image: "fedora:latest",         data: "1", glob: "dist/*.rpm" }
          - { format: rpm,  arch: arm64,  runner: ubuntu-24.04-arm,  image: "fedora:latest",         data: "0", glob: "dist/*.rpm" }
          # --- Arch Linux packages, built with makepkg. Arch Linux ARM has no Docker Hub image: its root
          #     filesystem is imported below (the runner is arm64, so nothing is emulated).
          - { format: arch, arch: x86_64, runner: ubuntu-latest,     image: "archlinux:base-devel",  data: "1", glob: "dist/*.pkg.tar.zst" }
          - { format: arch, arch: arm64,  runner: ubuntu-24.04-arm,  image: "alarm-local:latest",    data: "0", glob: "dist/*.pkg.tar.zst", rootfs: "ArchLinuxARM-aarch64-latest.tar.gz" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Artifact version
        run: echo "PKG_VERSION=$(sh scripts/pkg-version.sh)" >> "$GITHUB_ENV"
      - name: Import the Arch Linux ARM root filesystem
        if: matrix.rootfs != ''
        run: |
          for base in https://os.archlinuxarm.org/os http://os.archlinuxarm.org/os; do
            curl -fsSLO "$base/${{ matrix.rootfs }}" && curl -fsSLO "$base/${{ matrix.rootfs }}.md5" && break
          done
          [ -s "${{ matrix.rootfs }}" ] || { echo "::error::could not download ${{ matrix.rootfs }}"; exit 1; }
          md5sum -c "${{ matrix.rootfs }}.md5"
          docker import --platform linux/arm64 "${{ matrix.rootfs }}" ${{ matrix.image }}
      - name: Build ${{ matrix.format }} packages in ${{ matrix.image }}
        run: |
          docker run --rm \
            -e PKG_VERSION -e FORMAT=${{ matrix.format }} -e BUILD_DATA=${{ matrix.data }} \
            -v "$PWD:/src" -w /src ${{ matrix.image }} sh scripts/ci-package-build.sh
      - name: List packages
        run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: LH4051-DE-${{ matrix.format }}-${{ matrix.arch }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
