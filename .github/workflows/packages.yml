name: Arch and CachyOS repositories

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: arch-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-dev:
    # Run scheduled/manual development builds only from main.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine development package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(awk -F '"' '/^#define LH4051_VERSION / { print $2; exit }' src/longhorn.h)"
          build_date="$(date -u +%Y%m%d)"
          short_sha="$(git rev-parse --short=7 "$GITHUB_SHA")"
          pkgver="${base_version}.${build_date}.g${short_sha}"
          echo "version=$pkgver" >> "$GITHUB_OUTPUT"
          echo "Development package version: $pkgver"

  build:
    needs: validate-dev
    name: ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: kuznix-arch
            image: archlinux:base-devel
            profile: arch
            march: ""
          - repo: kuznix-cachy
            image: cachyos/cachyos
            profile: cachy
            march: x86-64
          - repo: kuznix-cachy-v3
            image: cachyos/cachyos-v3
            profile: cachy
            march: x86-64-v3
          - repo: kuznix-cachy-v4
            # Generic image avoids the AVX-512 host-CPU requirement of cachyos-v4.
            image: cachyos/cachyos
            profile: cachy
            march: x86-64-v4
          - repo: kuznix-cachy-znver4
            image: cachyos/cachyos
            profile: cachy
            march: znver4
    steps:
      - name: Check out current LH4051-DE main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build split packages in ${{ matrix.image }}
        env:
          BUILD_IMAGE: ${{ matrix.image }}
          BUILD_PROFILE: ${{ matrix.profile }}
          BUILD_MARCH: ${{ matrix.march }}
          PKGVER: ${{ needs.validate-dev.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "out/${{ matrix.repo }}"
          docker pull "$BUILD_IMAGE"
          docker run --rm \
            -e BUILD_PROFILE -e BUILD_MARCH -e PKGVER -e SOURCE_COMMIT \
            -v "$PWD:/src:ro" \
            -v "$PWD/out/${{ matrix.repo }}:/out" \
            "$BUILD_IMAGE" bash /src/scripts/ci-arch-repo-build.sh
          echo "Built packages for ${{ matrix.repo }}:"
          ls -lh "out/${{ matrix.repo }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.repo }}
          path: out/${{ matrix.repo }}/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: kuznix-arch-repository-publish
      cancel-in-progress: false
    steps:
      - name: Check out package repository
        uses: actions/checkout@v4
        with:
          repository: kuznix-code/repo
          ref: main
          path: repo
          # Fine-grained PAT: Contents read/write on kuznix-code/repo, stored as REPO_TOKEN.
          token: ${{ secrets.REPO_TOKEN }}

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: artifacts

      - name: Update development package databases
        shell: bash
        run: |
          set -euo pipefail
          repositories=(
            kuznix-arch
            kuznix-cachy
            kuznix-cachy-v3
            kuznix-cachy-v4
            kuznix-cachy-znver4
          )

          docker pull archlinux:base-devel
          for name in "${repositories[@]}"; do
            source_dir="artifacts/packages-${name}"
            target_dir="repo/${name}-dev/x86_64"
            mkdir -p "$target_dir"
            find "$target_dir" -maxdepth 1 -type f -name '*.pkg.tar.zst' -delete
            rm -f "$target_dir/${name}-dev.db" "$target_dir/${name}-dev.db.tar.gz" \
              "$target_dir/${name}-dev.files" "$target_dir/${name}-dev.files.tar.gz" \
              "$target_dir/${name}-dev.db.tar.gz.sig" "$target_dir/${name}-dev.files.tar.gz.sig"

            shopt -s nullglob
            packages=("$source_dir"/*.pkg.tar.zst)
            if (( ${#packages[@]} == 0 )); then
              echo "::error::No package artifacts found for ${name}-dev"
              exit 1
            fi
            cp "${packages[@]}" "$target_dir/"

            docker run --rm \
              -v "$PWD/$target_dir:/repo" \
              archlinux:base-devel \
              bash -lc "repo-add '/repo/${name}-dev.db.tar.gz' /repo/*.pkg.tar.zst"

            # Publish regular database files as well as repo-add's archive names.
            for database in db files; do
              rm -f "$target_dir/${name}-dev.${database}"
              cp "$target_dir/${name}-dev.${database}.tar.gz" "$target_dir/${name}-dev.${database}"
            done
          done

      - name: Commit development package repositories
        shell: bash
        run: |
          set -euo pipefail
          git -C repo config user.name "github-actions[bot]"
          git -C repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C repo add -A kuznix-arch-dev kuznix-cachy-dev kuznix-cachy-v3-dev kuznix-cachy-v4-dev kuznix-cachy-znver4-dev
          if git -C repo diff --cached --quiet; then
            echo "No repository changes to publish."
            exit 0
          fi
          git -C repo commit -m "Publish LH4051-DE development packages"
          git -C repo push origin HEAD:main
