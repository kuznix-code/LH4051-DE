name: build

on:
  push:
    branches-ignore:
      - redesign-4051
    # Without this a tag push does not run the workflow at all, so no vX.Y.Z release would ever be published.
    tags:
      - 'v*'
  pull_request:
    branches-ignore:
      - redesign-4051
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- Linux
  # Updater scripts: syntax only (they need GitHub to do real work)
  updater-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in scripts/lh4051-de-updater scripts/lh4051-de-bootstrap scripts/check-win7.sh scripts/bundle-win.sh scripts/ci-container-build.sh; do
            if [ -f "$f" ]; then sh -n "$f"; fi
          done
      - name: PowerShell updater parses
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/windows/lh4051-de-updater.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            # GitHub's Linux arm64 label (there is no "ubuntu-latest-arm").
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Artifact version
        run: echo "PKG_VERSION=$(sh scripts/pkg-version.sh)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libglib2.0-dev-bin
          sudo apt-get install -y libgtk4-layer-shell-dev || echo "layer-shell not available; building composite-only"
      - name: Build
        run: make -j$(nproc) show-config all
      - name: Smoke test
        run: ./build/linux-gcc/lh4051-de --version
      - name: Package + LH4051-DE Installer
        run: make dist-linux installer-unix TARGET_OS=linux
      - uses: actions/upload-artifact@v4
        with:
          name: lh4051-de-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*Installer*.run

  # x86-64 microarchitecture levels. The plain linux-x64 build above is the baseline (v1) that runs on every
  # x86-64 PC; these are optional, faster builds that need a newer CPU (and the updater's --variant option).
  linux-x64-variants:
    name: linux-${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64-v2
            march: x86-64-v2
            dist: x86_64-v2
            needs: "ssse3 sse4_1 sse4_2 popcnt cx16"
          - name: x64-v3
            march: x86-64-v3
            dist: x86_64-v3
            needs: "avx2 bmi1 bmi2 fma movbe abm f16c"
          - name: x64-v4
            march: x86-64-v4
            dist: x86_64-v4
            needs: "avx512f avx512bw avx512cd avx512dq avx512vl"
          - name: x64-zen4
            march: znver4
            dist: x86_64-zen4
            needs: "avx512f avx512_bf16 avx512_vbmi2"
    steps:
      - uses: actions/checkout@v4
      - name: Artifact version
        run: echo "PKG_VERSION=$(sh scripts/pkg-version.sh)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libglib2.0-dev-bin
          sudo apt-get install -y libgtk4-layer-shell-dev || echo "layer-shell not available; building composite-only"
      - name: Build (-march=${{ matrix.march }})
        run: make -j$(nproc) show-config all MARCH=${{ matrix.march }}
      - name: Smoke test (only when this runner's CPU can run the build)
        run: |
          missing=""
          for f in ${{ matrix.needs }}; do grep -qw "$f" /proc/cpuinfo || missing="$missing $f"; done
          if [ -n "$missing" ]; then
            echo "::notice::This runner's CPU lacks:$missing - built but not run."
          else
            ./build/linux-gcc/lh4051-de --version
          fi
      - name: Package + LH4051-DE Installer
        run: make dist-linux installer-unix TARGET_OS=linux MARCH=${{ matrix.march }} DIST_ARCH=${{ matrix.dist }}
      - uses: actions/upload-artifact@v4
        with:
          name: lh4051-de-linux-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*Installer*.run

  # Other Linux targets, built inside a distribution container (QEMU emulates the foreign CPUs, so these are slow).
  # musl = Alpine, glibc = Debian trixie (GTK 4.18). linux-mips64el is not built: Debian dropped mips64el in trixie
  # (bookworm has no Docker image for it and its GTK 4.8 is older than the 4.10 LH4051-DE needs), so there is no
  # distribution container with a usable GTK for it; the updater compiles from source there.
  linux-containers:
    name: linux-${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: musl-x64,   platform: linux/amd64,   image: "alpine:edge",    pm: apk, dist: musl-x86_64, skip: "0" }
          - { name: musl-x86,   platform: linux/386,     image: "alpine:edge",    pm: apk, dist: musl-i686,   skip: "0" }
          - { name: musl-arm64, platform: linux/arm64,   image: "alpine:edge",    pm: apk, dist: musl-arm64,  skip: "0" }
          - { name: x86,        platform: linux/386,     image: "debian:trixie",  pm: apt, dist: i686,        skip: "0" }
          - { name: riscv64,    platform: linux/riscv64, image: "debian:trixie",  pm: apt, dist: riscv64,     skip: "0" }
          - { name: ppc64el,    platform: linux/ppc64le, image: "debian:trixie",  pm: apt, dist: ppc64el,     skip: "0" }
          - { name: s390x,      platform: linux/s390x,   image: "debian:trixie",  pm: apt, dist: s390x,       skip: "0" }
          - { name: armv7,      platform: linux/arm/v7,  image: "debian:trixie",  pm: apt, dist: armv7,       skip: "0" }
    steps:
      - uses: actions/checkout@v4
      - name: Artifact version
        run: echo "PKG_VERSION=$(sh scripts/pkg-version.sh)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - name: Build in ${{ matrix.image }} (${{ matrix.platform }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -e PKG_VERSION -e PM=${{ matrix.pm }} -e DIST_ARCH=${{ matrix.dist }} -e ALLOW_SKIP=${{ matrix.skip }} \
            -v "$PWD:/src" -w /src ${{ matrix.image }} sh scripts/ci-container-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lh4051-de-linux-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            dist/*.tar.gz
            dist/*Installer*.run

  # ---------------------------------------------------------------- macOS
  macos:
    name: macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel   # Intel
          - arch: arm64
            runner: macos-latest     # Apple Silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Artifact version
        run: echo "PKG_VERSION=$(sh scripts/pkg-version.sh)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: brew install gtk4 pkgconf
      - name: Build
        run: make -j$(sysctl -n hw.ncpu) macos show-config
      - name: Smoke test
        run: ./build/macos-clang/lh4051-de --version
      - name: App bundle + LH4051-DE Installer (.pkg)
        run: make installer-macos
      - uses: actions/upload-artifact@v4
        with:
          name: lh4051-de-macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*Installer*.pkg

  # ------------------------------------------------------------------ BSD
  # Experimental: builds inside a VM on a Linux runner. (OpenBSD/NetBSD are not built in CI.)
  freebsd:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Artifact version
        run: echo "PKG_VERSION=$(sh scripts/pkg-version.sh)" >> "$GITHUB_ENV"
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          envs: 'PKG_VERSION'
          prepare: pkg install -y gmake gtk4 pkgconf glib
          run: |
            gmake show-config all
            ./build/bsd-gcc/lh4051-de --version
            gmake dist-unix installer-unix TARGET_OS=bsd
      - uses: actions/upload-artifact@v4
        with:
          name: lh4051-de-freebsd-x64
          path: |
            dist/*.tar.gz
            dist/*Installer*.run

  # -------------------------------------------------------------- Windows
  # MinGW-w64 through MSYS2. The plain MINGW64 environment is phased out
  # (no gtk4 package); x64 uses UCRT64, ARM64 uses CLANGARM64.
  windows-mingw:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            msystem: UCRT64
            cc: gcc
            experimental: false
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            cc: clang
            experimental: false
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Artifact version
        shell: pwsh
        run: |
          $base = (Select-String -Path src/longhorn.h -Pattern 'LH4051_VERSION "(.*)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "$base." + (git show -s --format=%cd --date=format:%Y%m%d HEAD) + "." + (git rev-parse --short=7 HEAD) }
          "PKG_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PKG_VERSION=$v"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make zip
          # pacboy expands ":p" to the right prefix for the environment
          # (mingw-w64-ucrt-x86_64-, mingw-w64-clang-aarch64-, mingw-w64-i686-, ...)
          pacboy: >-
            toolchain:p
            pkgconf:p
            gtk4:p
            glib2:p
            adwaita-icon-theme:p
      - name: Build
        run: make -j$(nproc) win64 CC=${{ matrix.cc }} show-config
      - name: Smoke test
        run: ./build/windows-mingw/lh4051-de.exe --version
      - name: Bundle
        run: make dist-win64 CC=${{ matrix.cc }} WIN_ARCH=${{ matrix.arch }}
      - name: Installer paths
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "dist\lh4051-de-$env:PKG_VERSION-win-${{ matrix.arch }}"
          if (-not (Test-Path $bundle)) { Get-ChildItem dist; throw "bundle dir missing: $bundle" }
          "LH_VERSION=$env:PKG_VERSION","LH_ARCH=${{ matrix.arch }}","LH_BUNDLE=$bundle","LH_OUT=$PWD\dist" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: LH4051-DE Installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer/lh4051-de.iss
      - name: List output
        shell: pwsh
        run: Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: lh4051-de-windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*Installer*.exe

  # ------------------------------------------------- Windows 7 / 8 / 8.1
  # Experimental: builds the exe against the Windows 7 API level and scans the exe plus the bundled
  # GTK runtime for imports that only exist on newer Windows. A "found" result means the GTK/MSYS2
  # runtime (not LH4051-DE itself) needs a Windows 7 capable build.
  windows-legacy:
    name: windows-x64-legacy (7/8/8.1 check)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make zip binutils
          pacboy: >-
            toolchain:p
            pkgconf:p
            gtk4:p
            glib2:p
            adwaita-icon-theme:p
      - name: Build with the Windows 7 target
        run: make -j$(nproc) win64-legacy CC=gcc show-config
      - name: Smoke test
        run: ./build/windows-legacy/lh4051-de.exe --version
      - name: Scan the executable for post-Windows-7 imports
        run: sh scripts/check-win7.sh build/windows-legacy/lh4051-de.exe
      - name: Scan the GTK runtime (informational)
        continue-on-error: true
        run: |
          sh scripts/bundle-win.sh build/windows-legacy/lh4051-de.exe dist/legacy-bundle x86_64-w64-mingw32 || true
          sh scripts/check-win7.sh dist/legacy-bundle

  # ----------------------------------------------------------------- MSVC
  # Experimental: cl.exe + a prebuilt GTK4 from gvsbuild. GNU make and a
  # native pkgconf come from MSYS2 UCRT64; MSVC's environment is inherited.
  windows-msvc:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Fetch GTK4 (gvsbuild)
        shell: pwsh
        run: |
          gh release download --repo wingtk/gvsbuild --pattern 'GTK4_Gvsbuild_*_x64.zip' --dir gtkdl
          Expand-Archive (Get-ChildItem gtkdl/*.zip).FullName -DestinationPath C:\gtk
          # The zip may or may not have a top-level folder: locate the real prefix.
          $pc = Get-ChildItem C:\gtk -Recurse -Filter gtk4.pc | Select-Object -First 1
          if (-not $pc) { throw "gtk4.pc not found in the gvsbuild archive" }
          $prefix = (Split-Path (Split-Path (Split-Path $pc.FullName))) -replace '\\','/'
          "GTK_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "GTK_PREFIX=$prefix"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit   # keep the MSVC PATH/INCLUDE/LIB from msvc-dev-cmd
          update: true
          install: make
          pacboy: >-
            pkgconf:p
            glib2:p
      - name: Build
        shell: msys2 {0}
        run: |
          # MSYS2's coreutils `link` would shadow MSVC's link.exe.
          rm -f /usr/bin/link.exe
          export PATH="$GTK_PREFIX/bin:$PATH"
          make msvc CC=cl GTK_PREFIX="$GTK_PREFIX" show-config
      - uses: actions/upload-artifact@v4
        with:
          name: lh4051-de-windows-msvc
          path: build/windows-msvc/lh4051-de.exe

  # ------------------------------------------------- Rolling CI release
  # Every push to a branch refreshes the pre-release "ci-<branch>" with that build's installers. The updater's dev modes
  # (dev, stable-dev, ...) download from it, so they need no GitHub token (raw Actions artifacts do).
  # ci-build.txt carries the exact version and commit. The tag has no vX.Y.Z form, so stable/beta/lts modes ignore it.
  ci-release:
    if: always() && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: [linux, linux-x64-variants, linux-containers, macos, freebsd, windows-mingw]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish ci-<branch>
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="ci-$(printf '%s' "$BRANCH" | tr '/' '-')"
          version="$(sh scripts/pkg-version.sh)"
          mkdir -p out
          cp artifacts/*Installer* out/ 2>/dev/null || true
          ls out | grep -q . || { echo "::warning::no installers were built; not publishing $tag"; exit 0; }
          printf 'version=%s\nsha=%s\nbranch=%s\n' "$version" "$GITHUB_SHA" "$BRANCH" > out/ci-build.txt
          gh release delete "$tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "CI build of $BRANCH ($version)" \
            --notes "Rolling build of the $BRANCH branch at ${GITHUB_SHA::7}. Not a release; use LH4051-DE Updater (dev modes)."

  # -------------------------------------------------------------- Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-x64-variants, linux-containers, macos, windows-mingw]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Updater scripts
        run: |
          cp src/scripts/lh4051-de-updater artifacts/lh4051-de-updater
          if [ -f src/scripts/lh4051-de-bootstrap ]; then cp src/scripts/lh4051-de-bootstrap artifacts/lh4051-de-bootstrap; fi
          cp src/windows/lh4051-de-updater.ps1 src/windows/lh4051-de-updater.cmd artifacts/
      # Tags with a suffix (v0.3.0-beta.1, v0.2.0-rc.1) are published as prereleases: the updater's beta mode
      # follows those, stable mode follows plain vX.Y.Z tags.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
